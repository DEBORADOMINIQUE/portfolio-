<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso restrito · meu.painel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Guarda se a página abriu pelo link de "esqueci minha senha" antes do Supabase limpar o endereço -->
  <script>window.__abriuRecuperacao = /type=recovery/.test(window.location.hash);</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/auth.js"></script>

  <style>
    /* ===== Design system ===== */
    :root {
      --vinho: #6e1423;
      --vinho-escuro: #3d0b14;
      --creme: #f1e6cf;
      --creme-claro: #f7f0e1;
      --dourado: #c9a86a;
      --branco: #fcf8f0;
      --grafite: #2a1a14;
      --suave: #5b463b;
      --borda: #e3d4b8;
      --verde: #2D6A45;
      --vermelho: #A8322B;
      --raio: 16px;
      --raio-g: 24px;
      --sombra: 0 1px 2px rgba(42,26,20,.04), 0 12px 32px rgba(42,26,20,.08);
      --titulo: 'Playfair Display', Georgia, serif;
      --texto: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; background: var(--creme); color: var(--grafite);
      font-family: var(--texto); font-size: 15px; line-height: 1.5;
    }
    .cartao {
      width: 100%; max-width: 400px; background: var(--branco);
      border: 1px solid var(--borda); border-radius: var(--raio-g);
      box-shadow: var(--sombra); padding: 40px 32px;
    }
    .logo { font-family: var(--titulo); font-weight: 600; font-size: 20px; margin-bottom: 28px; }
    .logo span { color: var(--dourado); }
    h1 { font-family: var(--titulo); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0 0 8px; }
    .sub { color: var(--suave); margin: 0 0 28px; }

    .aviso { display: none; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 18px; }
    .aviso.erro { display: block; background: #FBECEA; color: var(--vermelho); border: 1px solid #F0C9C5; }
    .aviso.ok { display: block; background: #E8F3EC; color: var(--verde); border: 1px solid #C3E0CE; }

    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input {
      width: 100%; font: inherit; color: inherit; background: var(--creme);
      border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: var(--vinho); box-shadow: 0 0 0 3px rgba(110,20,35,.15); background: var(--branco); }

    .linha { display: flex; justify-content: flex-end; margin: -6px 0 20px; }
    .link { background: none; border: 0; padding: 0; font: inherit; font-size: 14px; color: var(--vinho); cursor: pointer; }
    .link:hover { color: var(--vinho-escuro); text-decoration: underline; }

    .botao {
      width: 100%; font: inherit; font-weight: 600; color: #fff; background: var(--vinho);
      border: 0; border-radius: 12px; padding: 13px; cursor: pointer; transition: background .15s;
    }
    .botao:hover { background: var(--vinho-escuro); }
    .botao:disabled { opacity: .65; cursor: wait; }
    .voltar { display: block; margin: 18px auto 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="logo">meu<span>.</span>painel</div>
    <h1 id="titulo">Acesso restrito</h1>
    <p class="sub" id="subtitulo">Faça login para ver os números do seu portfólio.</p>

    <div class="aviso" id="aviso" role="alert"></div>

    <!-- Login -->
    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <div class="linha"><button type="button" class="link" id="ir-recuperar">Esqueci minha senha</button></div>
      <button class="botao" type="submit" id="btn-entrar">Entrar</button>
    </form>

    <!-- Esqueci minha senha -->
    <form id="form-recuperar" novalidate hidden>
      <label for="email-rec">E-mail</label>
      <input id="email-rec" type="email" autocomplete="email" required>
      <button class="botao" type="submit" id="btn-recuperar">Enviar link de recuperação</button>
      <button type="button" class="link voltar" id="voltar-login">Voltar para o login</button>
    </form>

    <!-- Nova senha (depois de clicar no link do e-mail) -->
    <form id="form-nova" novalidate hidden>
      <label for="nova-senha">Nova senha</label>
      <input id="nova-senha" type="password" autocomplete="new-password" minlength="6" required>
      <button class="botao" type="submit" id="btn-nova">Salvar nova senha</button>
    </form>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const forms = { login: $('form-login'), recuperar: $('form-recuperar'), nova: $('form-nova') };

    function mostrarAviso(texto, tipo) {
      const el = $('aviso');
      el.textContent = texto;
      el.className = 'aviso ' + tipo;
    }
    function limparAviso() { $('aviso').className = 'aviso'; }

    function trocarTela(qual) {
      Object.entries(forms).forEach(([nome, f]) => { f.hidden = nome !== qual; });
      limparAviso();
      const textos = {
        login: ['Acesso restrito', 'Faça login para ver os números do seu portfólio.'],
        recuperar: ['Recuperar senha', 'Digite seu e-mail e enviaremos um link para criar uma nova senha.'],
        nova: ['Crie uma nova senha', 'Escolha uma senha com pelo menos 6 caracteres.']
      };
      $('titulo').textContent = textos[qual][0];
      $('subtitulo').textContent = textos[qual][1];
    }

    // Botão em estado "carregando"
    function carregando(botao, ativo, textoCarregando) {
      if (ativo) { botao.dataset.original = botao.textContent; botao.textContent = textoCarregando; }
      else if (botao.dataset.original) { botao.textContent = botao.dataset.original; }
      botao.disabled = ativo;
    }

    // Ao abrir: se veio do link de recuperação, pede a nova senha; se já está logada, vai pro painel
    (async () => {
      if (window.__abriuRecuperacao) { trocarTela('nova'); return; }
      const usuario = await Auth.sessaoAtual();
      if (usuario) window.location.replace('painel.html');
    })();
    Auth.client.auth.onAuthStateChange((evento) => {
      if (evento === 'PASSWORD_RECOVERY') trocarTela('nova');
    });

    $('ir-recuperar').addEventListener('click', () => {
      trocarTela('recuperar');
      $('email-rec').value = $('email').value;
    });
    $('voltar-login').addEventListener('click', () => trocarTela('login'));

    forms.login.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email').value.trim();
      const senha = $('senha').value;
      if (!email || !senha) return mostrarAviso('Preencha e-mail e senha.', 'erro');
      limparAviso();
      carregando($('btn-entrar'), true, 'Entrando...');
      try {
        await Auth.login(email, senha);
        window.location.replace('painel.html');
      } catch (err) {
        mostrarAviso(err.message, 'erro');
        carregando($('btn-entrar'), false);
      }
    });

    forms.recuperar.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('email-rec').value.trim();
      if (!email) return mostrarAviso('Digite seu e-mail.', 'erro');
      carregando($('btn-recuperar'), true, 'Enviando...');
      try {
        await Auth.recuperarSenha(email);
        mostrarAviso('Pronto! Se este e-mail tiver acesso, você vai receber um link em instantes.', 'ok');
      } catch (err) {
        mostrarAviso(err.message, 'erro');
      }
      carregando($('btn-recuperar'), false);
    });

    forms.nova.addEventListener('submit', async (e) => {
      e.preventDefault();
      const senha = $('nova-senha').value;
      if (senha.length < 6) return mostrarAviso('A senha precisa ter pelo menos 6 caracteres.', 'erro');
      carregando($('btn-nova'), true, 'Salvando...');
      try {
        await Auth.definirNovaSenha(senha);
        mostrarAviso('Senha salva! Abrindo seu painel...', 'ok');
        setTimeout(() => window.location.replace('painel.html'), 1200);
      } catch (err) {
        mostrarAviso(err.message, 'erro');
        carregando($('btn-nova'), false);
      }
    });
  </script>
</body>
</html>
